services:
  # Frontend (Next.js)
  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:8001}
    ports:
      - "3001:3000"
    volumes:
      - ./front-end/src:/app/src
      - ./front-end/app:/app/app
      - ./front-end/public:/app/public
    depends_on:
      - backend
    networks:
      - food-network
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-http://localhost:8000}

  # Backend (Node.js/Express)
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    command: sh -c "npx prisma migrate deploy && npm run dev"
    ports:
      - "8001:8000"
    volumes:
      - ./back-end/src:/app/src
      - ./back-end/prisma:/app/prisma
    environment:
      - PORT=8000
      - TZ=America/Sao_Paulo
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - INITIAL_SUPERADMIN_PASSWORD=${INITIAL_SUPERADMIN_PASSWORD}
      - EFI_SANDBOX=${EFI_SANDBOX}
      - EFI_CLIENT_ID=${EFI_CLIENT_ID}
      - EFI_CLIENT_SECRET=${EFI_CLIENT_SECRET}
      - EFI_CERT_BASE64=${EFI_CERT_BASE64}
      - PIX_WEBHOOK_SECRET=${PIX_WEBHOOK_SECRET}
    depends_on:
      - db
    networks:
      - food-network

  # Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # ⚠️ CUIDADO: Porta 5432 removida em produção
    # Descomente apenas em desenvolvimento local:
    # ⚠️ CUIDADO: Porta 5432 removida em produção
    # Descomente apenas em desenvolvimento local:
    ports:
     - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - food-network

networks:
  food-network:
    driver: bridge

volumes:
  postgres_data:
