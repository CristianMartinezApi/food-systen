name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validar aplicação
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            front-end/package-lock.json
            back-end/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: front-end
        run: npm ci

      - name: Testar interface da loja
        working-directory: front-end
        run: npm run test:shop-ui

      - name: Validar TypeScript do frontend
        working-directory: front-end
        run: npx tsc --noEmit

      - name: Compilar frontend
        working-directory: front-end
        run: npm run build

      - name: Instalar dependências do backend
        working-directory: back-end
        run: npm ci

      - name: Gerar Prisma Client
        working-directory: back-end
        run: npx prisma generate

      - name: Compilar backend
        working-directory: back-end
        run: npm run build

      - name: Testar backend
        working-directory: back-end
        run: npm test

  deploy:
    name: Publicar na VPS
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Configurar acesso SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Atualizar aplicação
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          ssh -p "${VPS_SSH_PORT:-22}" \
            "$VPS_SSH_USER@$VPS_SSH_HOST" \
            "cd /root/food-systen && \
             git pull --ff-only origin main && \
             test \"\$(git rev-parse HEAD)\" = \"$DEPLOY_COMMIT\" && \
             flock -n /tmp/food-systen-deploy.lock bash deploy/deploy.sh"

      - name: Validar produção
        run: |
          curl --fail --show-error --silent \
            --retry 6 --retry-delay 5 --retry-all-errors \
            --output /dev/null \
            https://foodsystem.app.br/
