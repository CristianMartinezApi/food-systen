services:
  # Frontend (Next.js)
  frontend:
    build:
      context: ../front-end
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_API_URL: ${DEPLOY_NEXT_PUBLIC_API_URL:-http://localhost:8001/api}
        NEXT_PUBLIC_SOCKET_URL: ${DEPLOY_NEXT_PUBLIC_SOCKET_URL:-http://localhost:8001}
    # Webpack respeita WATCHPACK_POLLING nos volumes montados do Docker Desktop/Windows.
    command: npm run dev -- --webpack -H 0.0.0.0
    ports:
      - "3001:3000"
    volumes:
      - ../front-end/src:/app/src
      - ../front-end/app:/app/app
      - ../front-end/public:/app/public
      - frontend_next_cache:/app/.next
    depends_on:
      - backend
    networks:
      - food-network
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_API_URL=${DEPLOY_NEXT_PUBLIC_API_URL:-http://localhost:8001/api}
      - NEXT_PUBLIC_SOCKET_URL=${DEPLOY_NEXT_PUBLIC_SOCKET_URL:-http://localhost:8001}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}

  # Backend (Node.js/Express)
  backend:
    build:
      context: ../back-end
      dockerfile: Dockerfile
    command: sh -c "npx prisma migrate deploy && npm run dev"
    ports:
      - "8001:8000"
    volumes:
      - ../back-end/src:/app/src
      - ../back-end/prisma:/app/prisma
      - ../back-end/uploads:/app/uploads
    environment:
      - PORT=8000
      - NODE_ENV=development
      - TZ=America/Sao_Paulo
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-FoodSystem <noreply@foodsystem.app.br>}
      - FRONTEND_URL=${DEPLOY_FRONTEND_URL:-http://localhost:3001}
      # O compose local não deve herdar as origens restritas da VPS.
      - ALLOWED_ORIGINS=http://localhost:3001,http://127.0.0.1:3001,http://localhost:3000,http://127.0.0.1:3000
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - INITIAL_SUPERADMIN_PASSWORD=${INITIAL_SUPERADMIN_PASSWORD}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      - db
    networks:
      - food-network

  # Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # ⚠️ CUIDADO: Porta 5432 removida em produção
    # Descomente apenas em desenvolvimento local:
    # ⚠️ CUIDADO: Porta 5432 removida em produção
    # Descomente apenas em desenvolvimento local:
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - food-network

networks:
  food-network:
    driver: bridge

volumes:
  postgres_data:
    name: food-systen_postgres_data
  frontend_next_cache:
